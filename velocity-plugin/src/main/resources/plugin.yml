name: VestriConsoleBridge
version: 1.0.0
main: com.vestri.dynamic.bukkit.VestriConsoleBridge
api-version: '1.20'
description: Authenticated console-only lifecycle command forwarding to Velocity
commands:
  vestridynamic:
    description: Forward Vestri lifecycle commands from the backend console to Velocity
    usage: vestridynamic <templates|list|spawn|delete> [arguments]